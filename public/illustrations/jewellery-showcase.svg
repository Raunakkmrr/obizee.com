  <text x="400" y="380" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Your Online Showcase</text>

  <!-- Decorative -->
  <circle cx="40" cy="60" r="20" fill="#D4A574" opacity="0.08"/>
  <circle cx="300" cy="350" r="25" fill="#D4A574" opacity="0.06"/>
  <circle cx="280" cy="80" r="12" fill="#F97316" opacity="0.06"/>
