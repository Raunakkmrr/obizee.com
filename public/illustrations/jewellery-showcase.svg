  <path d="M411 212 L415 224 L419 212 Z" fill="#D4A574" opacity="0.8"/>
  <text x="436" y="208" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Drop Earrings</text>
  <text x="436" y="222" font-family="Arial, sans-serif" font-size="10" fill="#D4A574" font-weight="bold">Rs 1,200</text>
  <text x="436" y="234" font-family="Arial, sans-serif" font-size="7" fill="#16A34A">In Stock</text>

  <!-- Product Card 3 - Ring -->
  <rect x="378" y="254" width="154" height="60" rx="8" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="385" y="260" width="44" height="44" rx="6" fill="#FEF3C7"/>
