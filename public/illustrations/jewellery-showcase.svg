  <circle cx="75" cy="108" r="3" fill="#D4A574"/>
  <circle cx="90" cy="92" r="3" fill="#D4A574"/>
  <circle cx="108" cy="78" r="3" fill="#D4A574"/>
  <circle cx="162" cy="78" r="3" fill="#D4A574"/>
  <circle cx="180" cy="88" r="3" fill="#D4A574"/>
  <circle cx="198" cy="100" r="3" fill="#D4A574"/>
