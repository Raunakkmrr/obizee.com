<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Left: Phone screen with inventory list -->
  <rect x="40" y="30" width="220" height="350" rx="22" fill="#1F2937"/>
  <rect x="48" y="48" width="204" height="316" rx="14" fill="#FFFFFF"/>
  <!-- Notch -->
  <rect x="120" y="34" width="60" height="8" rx="4" fill="#374151"/>

  <!-- Phone header -->
  <rect x="48" y="48" width="204" height="36" rx="14" fill="#F97316"/>
  <rect x="48" y="64" width="204" height="20" fill="#F97316"/>
  <text x="90" y="72" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Inventory</text>
  <!-- Refresh icon -->
  <circle cx="232" cy="68" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  <path d="M228 64 L232 60 L236 64" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" fill="none"/>

  <!-- Summary bar -->
  <rect x="56" y="92" width="190" height="28" rx="8" fill="#F3F4F6"/>
  <text x="66" y="109" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Total: 12 items</text>
  <rect x="170" y="98" width="40" height="16" rx="4" fill="#F97316" opacity="0.1"/>
  <text x="175" y="110" font-family="Arial, sans-serif" font-size="7" fill="#F97316" font-weight="600">1 Low</text>
  <circle cx="214" cy="106" r="5" fill="#F97316" opacity="0.2"/>
  <text x="211" y="109" font-family="Arial, sans-serif" font-size="6" fill="#F97316" font-weight="bold">!</text>

  <!-- Inventory Item 1 - Rice (in stock) -->
  <rect x="56" y="128" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="62" y="133" width="28" height="28" rx="6" fill="#FEF3C7"/>
  <text x="70" y="151" font-family="Arial, sans-serif" font-size="8" fill="#92400E">R</text>
  <text x="96" y="146" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Rice</text>
  <text x="96" y="159" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">50 kg available</text>
  <!-- Green checkmark -->
  <circle cx="232" cy="148" r="8" fill="#DCFCE7"/>
  <path d="M228 148 L231 151 L236 145" stroke="#16A34A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Inventory Item 2 - Dal (in stock) -->
  <rect x="56" y="174" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="62" y="179" width="28" height="28" rx="6" fill="#FEF3C7"/>
  <text x="71" y="197" font-family="Arial, sans-serif" font-size="8" fill="#92400E">D</text>
  <text x="96" y="192" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Dal</text>
  <text x="96" y="205" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">20 kg available</text>
  <circle cx="232" cy="194" r="8" fill="#DCFCE7"/>
  <path d="M228 194 L231 197 L236 191" stroke="#16A34A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Inventory Item 3 - Sugar (LOW STOCK!) -->
  <rect x="56" y="220" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <rect x="62" y="225" width="28" height="28" rx="6" fill="#FFF7ED"/>
  <text x="71" y="243" font-family="Arial, sans-serif" font-size="8" fill="#F97316">S</text>
  <text x="96" y="238" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Sugar</text>
  <text x="96" y="251" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="600">5 kg - Low Stock!</text>
  <!-- Warning icon -->
  <circle cx="232" cy="240" r="8" fill="#FFF7ED"/>
  <text x="228" y="244" font-family="Arial, sans-serif" font-size="10" fill="#F97316" font-weight="bold">!</text>

  <!-- Inventory Item 4 - Milk (in stock) -->
  <rect x="56" y="266" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="62" y="271" width="28" height="28" rx="6" fill="#DBEAFE"/>
  <text x="70" y="289" font-family="Arial, sans-serif" font-size="8" fill="#1D4ED8">M</text>
  <text x="96" y="284" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Milk</text>
  <text x="96" y="297" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">30 L available</text>
  <circle cx="232" cy="286" r="8" fill="#DCFCE7"/>
  <path d="M228 286 L231 289 L236 283" stroke="#16A34A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Inventory Item 5 - Atta (in stock) -->
  <rect x="56" y="312" width="190" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="62" y="317" width="28" height="28" rx="6" fill="#FEF3C7"/>
  <text x="71" y="335" font-family="Arial, sans-serif" font-size="8" fill="#92400E">A</text>
  <text x="96" y="330" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Atta</text>
  <text x="96" y="343" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">15 kg available</text>
  <circle cx="232" cy="332" r="8" fill="#DCFCE7"/>
  <path d="M228 332 L231 335 L236 329" stroke="#16A34A" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Right: Shelves with products -->
  <!-- Shelf structure -->
  <rect x="340" y="80" width="220" height="240" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Shelf 1 -->
  <rect x="345" y="120" width="210" height="4" rx="2" fill="#D4A574" opacity="0.5"/>
  <!-- Rice bags - green highlight -->
  <rect x="355" y="88" width="30" height="32" rx="4" fill="#16A34A" opacity="0.15" stroke="#16A34A" stroke-width="1"/>
  <text x="362" y="108" font-family="Arial, sans-serif" font-size="7" fill="#16A34A" font-weight="600">Rice</text>
  <text x="363" y="118" font-family="Arial, sans-serif" font-size="6" fill="#16A34A">50kg</text>
  <rect x="390" y="90" width="28" height="30" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="423" y="92" width="26" height="28" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="454" y="88" width="30" height="32" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="489" y="90" width="28" height="30" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="522" y="92" width="28" height="28" rx="4" fill="#16A34A" opacity="0.1"/>

  <!-- Shelf 2 -->
  <rect x="345" y="180" width="210" height="4" rx="2" fill="#D4A574" opacity="0.5"/>
  <!-- Dal packets - green -->
  <rect x="355" y="150" width="26" height="30" rx="4" fill="#16A34A" opacity="0.15" stroke="#16A34A" stroke-width="1"/>
  <text x="361" y="169" font-family="Arial, sans-serif" font-size="7" fill="#16A34A" font-weight="600">Dal</text>
  <text x="360" y="178" font-family="Arial, sans-serif" font-size="6" fill="#16A34A">20kg</text>
  <rect x="386" y="152" width="24" height="28" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="415" y="150" width="26" height="30" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="446" y="152" width="24" height="28" rx="4" fill="#16A34A" opacity="0.1"/>

  <!-- Shelf 3 -->
  <rect x="345" y="240" width="210" height="4" rx="2" fill="#D4A574" opacity="0.5"/>
  <!-- Sugar - ORANGE highlight (low stock) -->
  <rect x="355" y="210" width="28" height="30" rx="4" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="1.5"/>
  <text x="357" y="228" font-family="Arial, sans-serif" font-size="6" fill="#F97316" font-weight="bold">Sugar</text>
  <text x="362" y="238" font-family="Arial, sans-serif" font-size="6" fill="#F97316">5kg</text>
  <!-- Only one more bag to show low stock -->
  <rect x="388" y="214" width="24" height="26" rx="4" fill="#F97316" opacity="0.08"/>
  <!-- Empty space -->
  <rect x="418" y="214" width="24" height="26" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3 2"/>
  <rect x="448" y="214" width="24" height="26" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3 2"/>
  <rect x="478" y="214" width="24" height="26" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- Shelf 4 -->
  <rect x="345" y="300" width="210" height="4" rx="2" fill="#D4A574" opacity="0.5"/>
  <!-- Milk - green -->
  <rect x="355" y="268" width="24" height="32" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="384" y="270" width="22" height="30" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="411" y="268" width="24" height="32" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="440" y="270" width="22" height="30" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="467" y="268" width="24" height="32" rx="4" fill="#16A34A" opacity="0.1"/>
  <rect x="496" y="270" width="22" height="30" rx="4" fill="#16A34A" opacity="0.1"/>

  <!-- Notification badge - Low stock alert -->
  <rect x="330" y="340" width="240" height="44" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="1.5"/>
  <!-- Bell icon -->
  <path d="M350 355 Q350 345 358 342 Q366 345 366 355" fill="none" stroke="#F97316" stroke-width="1.5"/>
  <rect x="347" y="355" width="22" height="3" rx="1.5" fill="#F97316"/>
  <circle cx="358" cy="360" r="2" fill="#F97316"/>
  <!-- Alert badge on bell -->
  <circle cx="366" cy="344" r="5" fill="#EF4444"/>
  <text x="364" y="347" font-family="Arial, sans-serif" font-size="5" fill="#FFFFFF" font-weight="bold">1</text>

  <text x="375" y="356" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="bold">Low stock alert: Sugar</text>
  <text x="375" y="370" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Only 5 kg remaining. Reorder soon.</text>

  <!-- Legend -->
  <circle cx="340" cy="50" r="6" fill="#16A34A" opacity="0.2"/>
  <text x="352" y="54" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">In Stock</text>
  <circle cx="420" cy="50" r="6" fill="#F97316" opacity="0.2"/>
  <text x="432" y="54" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Low Stock</text>
  <rect x="490" y="44" width="12" height="12" rx="2" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="0.8" stroke-dasharray="2 1"/>
  <text x="508" y="54" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Empty</text>

  <!-- Decorative -->
  <circle cx="300" cy="20" r="12" fill="#F97316" opacity="0.06"/>
  <circle cx="580" cy="380" r="20" fill="#F97316" opacity="0.05"/>
</svg>