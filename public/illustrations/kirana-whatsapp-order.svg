<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Background: neighborhood buildings -->
  <rect x="0" y="300" width="600" height="100" fill="#F3F4F6" opacity="0.4"/>
  <!-- Building 1 -->
  <rect x="10" y="280" width="50" height="120" rx="4" fill="#E5E7EB" opacity="0.5"/>
  <rect x="18" y="290" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.3"/>
  <rect x="34" y="290" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.3"/>
  <rect x="18" y="310" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.2"/>
  <rect x="34" y="310" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.3"/>
  <!-- Building 2 -->
  <rect x="70" y="260" width="45" height="140" rx="4" fill="#D1D5DB" opacity="0.4"/>
  <rect x="78" y="270" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.3"/>
  <rect x="92" y="270" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.2"/>
  <rect x="78" y="286" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.3"/>
  <rect x="92" y="286" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.3"/>
  <!-- Building 3 -->
  <rect x="490" y="270" width="55" height="130" rx="4" fill="#E5E7EB" opacity="0.4"/>
  <rect x="498" y="280" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.3"/>
  <rect x="516" y="280" width="10" height="10" rx="1" fill="#FBBF24" opacity="0.2"/>
  <!-- Building 4 -->
  <rect x="555" y="285" width="45" height="115" rx="4" fill="#D1D5DB" opacity="0.35"/>
  <rect x="563" y="295" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.25"/>
  <rect x="577" y="295" width="8" height="8" rx="1" fill="#FBBF24" opacity="0.3"/>

  <!-- Left: Customer at home -->
  <!-- Person silhouette -->
  <circle cx="100" cy="100" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="94" cy="97" r="2" fill="#1F2937"/>
  <circle cx="106" cy="97" r="2" fill="#1F2937"/>
  <path d="M95 105 Q100 110 105 105" stroke="#1F2937" stroke-width="1.2" fill="none"/>
  <!-- Body -->
  <rect x="82" y="124" width="36" height="45" rx="8" fill="#3B82F6" opacity="0.2" stroke="#1F2937" stroke-width="1"/>
  <!-- Phone in hand -->
  <rect x="120" y="135" width="28" height="45" rx="6" fill="#1F2937"/>
  <rect x="123" y="140" width="22" height="35" rx="4" fill="#25D366" opacity="0.3"/>
  <!-- Arm -->
  <line x1="118" y1="140" x2="124" y2="145" stroke="#1F2937" stroke-width="1.5"/>
  <text x="68" y="195" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Customer</text>

  <!-- Center: WhatsApp chat bubbles -->
  <!-- Customer message bubble -->
  <rect x="180" y="60" width="200" height="55" rx="12" fill="#DCF8C6" stroke="#A7F3D0" stroke-width="0.8"/>
  <text x="194" y="78" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Need 1kg rice, 500g dal,</text>
  <text x="194" y="92" font-family="Arial, sans-serif" font-size="9" fill="#1F2937">milk for tomorrow morning</text>
  <text x="350" y="108" font-family="Arial, sans-serif" font-size="6" fill="#9CA3AF">9:15 AM</text>
  <!-- Bubble tail -->
  <path d="M180 80 L170 75 L180 70" fill="#DCF8C6"/>

  <!-- Shop owner reply bubble -->
  <rect x="200" y="130" width="210" height="72" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="214" y="148" font-family="Arial, sans-serif" font-size="9" fill="#1F2937">Order ready! Total</text>
  <text x="214" y="162" font-family="Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="bold">Rs 350</text>
  <text x="214" y="178" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Place your order here:</text>
  <!-- Link button -->
  <rect x="214" y="182" width="140" height="14" rx="4" fill="#F97316" opacity="0.1"/>
  <text x="220" y="193" font-family="Arial, sans-serif" font-size="6" fill="#F97316" font-weight="600">obizee.com/sharma-kirana/order</text>
  <text x="380" y="196" font-family="Arial, sans-serif" font-size="6" fill="#9CA3AF">9:18 AM</text>
  <!-- Bubble tail -->
  <path d="M410 155 L420 150 L410 145" fill="#FFFFFF"/>

  <!-- Confirmed message -->
  <rect x="210" y="218" width="140" height="30" rx="10" fill="#DCF8C6" stroke="#A7F3D0" stroke-width="0.8"/>
  <text x="224" y="237" font-family="Arial, sans-serif" font-size="9" fill="#1F2937">Order placed! Thanks</text>
  <!-- Green checkmarks -->
  <circle cx="356" cy="244" r="0" fill="#25D366"/>
  <text x="340" y="244" font-family="Arial, sans-serif" font-size="5" fill="#25D366">9:20 AM</text>

  <!-- Right: Shop owner with phone -->
  <!-- Person silhouette -->
  <circle cx="500" cy="100" r="20" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <circle cx="494" cy="97" r="2" fill="#1F2937"/>
  <circle cx="506" cy="97" r="2" fill="#1F2937"/>
  <path d="M495 105 Q500 110 505 105" stroke="#1F2937" stroke-width="1.2" fill="none"/>
  <!-- Body with shop apron -->
  <rect x="482" y="124" width="36" height="45" rx="8" fill="#F97316" opacity="0.15" stroke="#1F2937" stroke-width="1"/>
  <!-- Apron pocket -->
  <rect x="490" y="145" width="20" height="12" rx="2" fill="#F97316" opacity="0.1" stroke="#1F2937" stroke-width="0.5"/>

  <!-- Phone in hand -->
  <rect x="455" y="135" width="28" height="45" rx="6" fill="#1F2937"/>
  <rect x="458" y="140" width="22" height="35" rx="4" fill="#F97316" opacity="0.3"/>
  <!-- Dashboard hint on phone -->
  <rect x="460" y="144" width="18" height="4" rx="1" fill="#FFFFFF" opacity="0.5"/>
  <rect x="460" y="152" width="12" height="3" rx="1" fill="#FFFFFF" opacity="0.3"/>
  <rect x="460" y="158" width="16" height="3" rx="1" fill="#FFFFFF" opacity="0.3"/>
  <rect x="460" y="164" width="10" height="3" rx="1" fill="#16A34A" opacity="0.4"/>
  <!-- Arm -->
  <line x1="480" y1="140" x2="476" y2="145" stroke="#1F2937" stroke-width="1.5"/>
  <text x="472" y="195" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Shop Owner</text>

  <!-- Connecting arrows -->
  <!-- Customer to chat -->
  <path d="M148 145 C160 120 170 100 180 85" stroke="#25D366" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Chat to owner -->
  <path d="M410 155 C430 140 445 140 455 145" stroke="#25D366" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- WhatsApp icon in center -->
  <circle cx="300" cy="35" r="14" fill="#25D366"/>
  <path d="M293 35 Q293 28 300 28 Q307 28 307 35 Q307 42 300 42 Q293 42 293 35 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M296 37 Q293 40 296 42" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>

  <!-- Order notification badge -->
  <rect x="230" y="262" width="140" height="30" rx="15" fill="#16A34A" opacity="0.1"/>
  <circle cx="250" cy="277" r="8" fill="#16A34A"/>
  <path d="M246 277 L249 280 L254 274" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <text x="264" y="281" font-family="Arial, sans-serif" font-size="9" fill="#16A34A" font-weight="600">Order Confirmed!</text>

  <!-- Decorative -->
  <circle cx="300" cy="370" r="30" fill="#F97316" opacity="0.04"/>
  <circle cx="50" cy="240" r="15" fill="#25D366" opacity="0.06"/>
  <circle cx="550" cy="220" r="18" fill="#F97316" opacity="0.06"/>
</svg>