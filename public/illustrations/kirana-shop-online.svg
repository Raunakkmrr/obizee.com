<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Left: Traditional kirana shop -->
  <!-- Shop structure -->
  <rect x="30" y="100" width="200" height="200" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Awning -->
  <path d="M20 100 L240 100 L240 70 L20 70 Z" fill="#F97316" opacity="0.8"/>
  <path d="M20 100 Q50 115 80 100 Q110 115 140 100 Q170 115 200 100 Q220 115 240 100" fill="#EA580C" opacity="0.3"/>
  <!-- Awning stripes -->
  <rect x="20" y="70" width="220" height="8" rx="2" fill="#EA580C"/>

  <!-- Shop sign -->
  <rect x="60" y="45" width="140" height="25" rx="6" fill="#1F2937"/>
  <text x="95" y="63" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold">Grocery</text>

  <!-- Shelves -->
  <!-- Shelf 1 -->
  <rect x="42" y="115" width="176" height="4" rx="2" fill="#D4A574" opacity="0.6"/>
  <!-- Items on shelf 1 -->
  <rect x="50" y="100" width="16" height="15" rx="2" fill="#EF4444" opacity="0.6"/>
  <rect x="70" y="98" width="14" height="17" rx="2" fill="#3B82F6" opacity="0.6"/>
  <rect x="88" y="100" width="18" height="15" rx="2" fill="#FBBF24" opacity="0.6"/>
  <rect x="110" y="97" width="14" height="18" rx="2" fill="#16A34A" opacity="0.6"/>
  <rect x="128" y="100" width="16" height="15" rx="2" fill="#8B5CF6" opacity="0.5"/>
  <rect x="148" y="98" width="18" height="17" rx="2" fill="#F97316" opacity="0.5"/>
  <rect x="170" y="100" width="14" height="15" rx="2" fill="#EC4899" opacity="0.5"/>
  <rect x="188" y="97" width="20" height="18" rx="2" fill="#14B8A6" opacity="0.5"/>

  <!-- Shelf 2 -->
  <rect x="42" y="160" width="176" height="4" rx="2" fill="#D4A574" opacity="0.6"/>
  <!-- Items on shelf 2 -->
  <rect x="50" y="140" width="20" height="20" rx="3" fill="#FBBF24" opacity="0.5"/>
  <text x="55" y="154" font-family="Arial, sans-serif" font-size="6" fill="#92400E">Rice</text>
  <rect x="74" y="142" width="18" height="18" rx="3" fill="#F97316" opacity="0.5"/>
  <text x="78" y="155" font-family="Arial, sans-serif" font-size="5" fill="#9A3412">Dal</text>
  <rect x="96" y="140" width="22" height="20" rx="3" fill="#16A34A" opacity="0.4"/>
  <text x="99" y="154" font-family="Arial, sans-serif" font-size="5" fill="#166534">Tea</text>
  <rect x="122" y="142" width="18" height="18" rx="3" fill="#EF4444" opacity="0.4"/>
  <rect x="144" y="140" width="20" height="20" rx="3" fill="#3B82F6" opacity="0.4"/>
  <circle cx="180" cy="150" r="10" fill="#FBBF24" opacity="0.4"/>
  <circle cx="200" cy="150" r="10" fill="#F97316" opacity="0.3"/>

  <!-- Shelf 3 -->
  <rect x="42" y="205" width="176" height="4" rx="2" fill="#D4A574" opacity="0.6"/>
  <!-- Items on shelf 3 -->
  <rect x="50" y="180" width="30" height="25" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="56" y="196" font-family="Arial, sans-serif" font-size="5" fill="#9CA3AF">Milk</text>
  <rect x="84" y="182" width="24" height="23" rx="3" fill="#FEF3C7" stroke="#FBBF24" stroke-width="0.5"/>
  <text x="88" y="197" font-family="Arial, sans-serif" font-size="5" fill="#92400E">Atta</text>
  <rect x="112" y="180" width="28" height="25" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="0.5"/>
  <text x="116" y="196" font-family="Arial, sans-serif" font-size="5" fill="#166534">Sugar</text>
  <rect x="144" y="182" width="22" height="23" rx="3" fill="#DBEAFE" stroke="#3B82F6" stroke-width="0.5"/>
  <rect x="170" y="180" width="26" height="25" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="0.5"/>

  <!-- Counter -->
  <rect x="30" y="260" width="200" height="14" rx="3" fill="#D4A574" opacity="0.5"/>
