  <rect x="55" y="248" width="24" height="12" rx="2" fill="#9CA3AF" opacity="0.3"/>
  <line x1="67" y1="248" x2="67" y2="238" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="57" y1="238" x2="77" y2="238" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Transformation bridge -->
  <path d="M240 180 C265 160 285 160 310 155" stroke="#F97316" stroke-width="2.5" stroke-dasharray="8 5" fill="none"/>
  <polygon points="308,149 316,155 308,161" fill="#F97316"/>

  <!-- Sparkles on bridge -->
  <path d="M265 165 L267 161 L269 165 L267 169 Z" fill="#F97316" opacity="0.5"/>
  <path d="M288 158 L290 154 L292 158 L290 162 Z" fill="#F97316" opacity="0.4"/>

  <!-- "Go Digital" text on bridge -->
  <text x="252" y="148" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="600">Go Digital</text>

  <!-- Right: Smartphone -->
  <rect x="330" y="50" width="210" height="320" rx="22" fill="#1F2937"/>
  <rect x="338" y="68" width="194" height="286" rx="14" fill="#FFFFFF"/>
  <!-- Notch -->
  <rect x="405" y="54" width="60" height="8" rx="4" fill="#374151"/>

  <!-- Phone header with oBizee -->
  <rect x="338" y="68" width="194" height="38" rx="14" fill="#F97316"/>
  <rect x="338" y="84" width="194" height="22" fill="#F97316"/>
  <!-- oBizee shopping bag icon -->
  <rect x="350" y="78" width="16" height="14" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <path d="M354 78 L354 74 Q358 69 362 74 L362 78" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
  <text x="370" y="91" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Sharma Kirana</text>

