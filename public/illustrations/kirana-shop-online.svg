  <line x1="512" y1="131" x2="516" y2="135" stroke="#9CA3AF" stroke-width="1.2"/>

  <!-- Product list -->
  <!-- Item 1 -->
  <rect x="348" y="148" width="174" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="354" y="153" width="32" height="32" rx="6" fill="#FEF3C7"/>
  <text x="362" y="173" font-family="Arial, sans-serif" font-size="8" fill="#92400E">Rice</text>
  <text x="392" y="166" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Basmati Rice 1kg</text>
  <text x="392" y="180" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="bold">Rs 85</text>
  <!-- Add to cart button -->
  <rect x="485" y="158" width="30" height="22" rx="6" fill="#F97316"/>
  <text x="493" y="173" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">+</text>

  <!-- Item 2 -->
  <rect x="348" y="198" width="174" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="354" y="203" width="32" height="32" rx="6" fill="#FEF3C7"/>
  <text x="364" y="223" font-family="Arial, sans-serif" font-size="8" fill="#92400E">Dal</text>
  <text x="392" y="216" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Toor Dal 500g</text>
  <text x="392" y="230" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="bold">Rs 65</text>
  <rect x="485" y="208" width="30" height="22" rx="6" fill="#F97316"/>
  <text x="493" y="223" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">+</text>

  <!-- Item 3 -->
  <rect x="348" y="248" width="174" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="354" y="253" width="32" height="32" rx="6" fill="#DCFCE7"/>
  <text x="360" y="273" font-family="Arial, sans-serif" font-size="8" fill="#166534">Tea</text>
  <text x="392" y="266" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Green Tea 250g</text>
  <text x="392" y="280" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="bold">Rs 120</text>
  <rect x="485" y="258" width="30" height="22" rx="6" fill="#F97316"/>
  <text x="493" y="273" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">+</text>

  <!-- Item 4 -->
  <rect x="348" y="298" width="174" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="354" y="303" width="32" height="32" rx="6" fill="#DBEAFE"/>
  <text x="360" y="323" font-family="Arial, sans-serif" font-size="7" fill="#1D4ED8">Milk</text>
  <text x="392" y="316" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Full Cream Milk 1L</text>
  <text x="392" y="330" font-family="Arial, sans-serif" font-size="8" fill="#F97316" font-weight="bold">Rs 60</text>
  <rect x="485" y="308" width="30" height="22" rx="6" fill="#F97316"/>
  <text x="493" y="323" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="bold">+</text>

  <!-- Decorative -->
  <circle cx="280" cy="350" r="20" fill="#F97316" opacity="0.06"/>
  <circle cx="560" cy="30" r="15" fill="#F97316" opacity="0.08"/>

  <!-- Labels -->
  <text x="72" y="310" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Your Kirana Shop</text>
  <text x="390" y="388" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Now Online with oBizee</text>
</svg>