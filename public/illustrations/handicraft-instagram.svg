  <!-- Mini earring -->
  <circle cx="430" cy="148" r="3" fill="none" stroke="#D4A574" stroke-width="1"/>
  <line x1="430" y1="151" x2="430" y2="156" stroke="#D4A574" stroke-width="0.8"/>
  <circle cx="430" cy="160" r="5" fill="#D4A574" opacity="0.3"/>
  <circle cx="450" cy="148" r="3" fill="none" stroke="#D4A574" stroke-width="1"/>
  <line x1="450" y1="151" x2="450" y2="156" stroke="#D4A574" stroke-width="0.8"/>
  <circle cx="450" cy="160" r="5" fill="#D4A574" opacity="0.3"/>
  <text x="412" y="193" font-family="Arial, sans-serif" font-size="7" fill="#1F2937" font-weight="600">Crochet Earrings</text>
  <text x="412" y="205" font-family="Arial, sans-serif" font-size="8" fill="#D4A574" font-weight="bold">Rs 280</text>

  <!-- Second product -->
  <rect x="485" y="125" width="74" height="90" rx="8" fill="#FFFBEB" stroke="#E5E7EB" stroke-width="0.8"/>
  <rect x="490" y="130" width="64" height="50" rx="4" fill="#FEE2E2"/>
  <rect x="505" y="140" width="18" height="25" rx="3" fill="#FFFFFF" stroke="#EF4444" stroke-width="1"/>
  <text x="492" y="193" font-family="Arial, sans-serif" font-size="7" fill="#1F2937" font-weight="600">Painted Mug</text>
  <text x="492" y="205" font-family="Arial, sans-serif" font-size="8" fill="#D4A574" font-weight="bold">Rs 350</text>

  <!-- Order button on website -->
  <rect x="430" y="225" width="100" height="22" rx="11" fill="#F97316"/>
