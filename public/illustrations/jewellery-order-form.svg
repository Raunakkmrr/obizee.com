<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Left: Smartphone/Tablet with form -->
  <rect x="50" y="40" width="240" height="340" rx="20" fill="#1F2937"/>
  <rect x="58" y="58" width="224" height="306" rx="14" fill="#FFFFFF"/>
  <!-- Notch -->
  <rect x="135" y="44" width="60" height="8" rx="4" fill="#374151"/>

  <!-- Form header -->
  <rect x="58" y="58" width="224" height="36" rx="14" fill="#D4A574"/>
  <rect x="58" y="74" width="224" height="20" fill="#D4A574"/>
  <text x="105" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Customize Your Order</text>

  <!-- Form fields -->
  <!-- Material -->
  <text x="72" y="115" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Material</text>
  <rect x="72" y="120" width="196" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Toggle buttons -->
  <rect x="78" y="125" width="55" height="22" rx="6" fill="#D4A574"/>
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">Gold</text>
  <rect x="138" y="125" width="55" height="22" rx="6" fill="#F3F4F6"/>
  <text x="148" y="140" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Silver</text>
  <rect x="198" y="125" width="65" height="22" rx="6" fill="#F3F4F6"/>
  <text x="205" y="140" font-family="Arial, sans-serif" font-size="9" fill="#9CA3AF">Rose Gold</text>

  <!-- Size -->
  <text x="72" y="172" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Ring Size</text>
  <rect x="72" y="177" width="196" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <circle cx="96" cy="193" r="12" fill="#F3F4F6"/>
  <text x="91" y="197" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">5</text>
  <circle cx="128" cy="193" r="12" fill="#F3F4F6"/>
  <text x="123" y="197" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">6</text>
  <circle cx="160" cy="193" r="12" fill="#D4A574"/>
  <text x="155" y="197" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold">7</text>
  <circle cx="192" cy="193" r="12" fill="#F3F4F6"/>
  <text x="187" y="197" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">8</text>
  <circle cx="224" cy="193" r="12" fill="#F3F4F6"/>
  <text x="219" y="197" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">9</text>

  <!-- Engraving -->
  <text x="72" y="228" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Engraving Text</text>
  <rect x="72" y="233" width="196" height="32" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="82" y="253" font-family="Arial, sans-serif" font-size="10" fill="#1F2937">Forever Yours</text>
  <line x1="82" y1="256" x2="168" y2="256" stroke="#D4A574" stroke-width="1" opacity="0.5"/>

  <!-- Quantity -->
  <text x="72" y="284" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Quantity</text>
  <rect x="72" y="289" width="80" height="28" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="78" y="294" width="18" height="18" rx="4" fill="#F3F4F6"/>
  <text x="84" y="307" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">-</text>
  <text x="106" y="308" font-family="Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="bold">1</text>
  <rect x="126" y="294" width="18" height="18" rx="4" fill="#F3F4F6"/>
  <text x="131" y="307" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">+</text>

  <!-- Price display -->
  <rect x="165" y="289" width="100" height="28" rx="8" fill="#FFFBEB" stroke="#D4A574" stroke-width="1"/>
  <text x="178" y="308" font-family="Arial, sans-serif" font-size="13" fill="#D4A574" font-weight="bold">Rs 1,500</text>

  <!-- Submit button -->
  <rect x="72" y="328" width="196" height="30" rx="15" fill="#F97316"/>
  <text x="120" y="348" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Submit Order</text>

  <!-- Right: Resulting product - Customized ring -->
  <!-- Ring display area -->
  <rect x="360" y="100" width="190" height="220" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Product label -->
  <text x="390" y="130" font-family="Arial, sans-serif" font-size="11" fill="#1F2937" font-weight="bold">Your Custom Ring</text>

  <!-- Big ring illustration -->
  <circle cx="455" cy="210" r="50" fill="none" stroke="#D4A574" stroke-width="6"/>
  <circle cx="455" cy="210" r="44" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.3"/>
  <!-- Gem/setting on top -->
  <circle cx="455" cy="160" r="14" fill="#D4A574"/>
  <circle cx="455" cy="160" r="9" fill="#FFFBEB"/>
  <circle cx="455" cy="160" r="5" fill="#F97316" opacity="0.6"/>
  <!-- Side stones -->
  <circle cx="440" cy="164" r="4" fill="#D4A574" opacity="0.7"/>
  <circle cx="470" cy="164" r="4" fill="#D4A574" opacity="0.7"/>
  <!-- Band details -->
  <path d="M420 240 Q437 260 455 262 Q473 260 490 240" stroke="#D4A574" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Engraving text on ring -->
  <text x="425" y="215" font-family="Georgia, serif" font-size="7" fill="#D4A574" font-style="italic">Forever Yours</text>

  <!-- Sparkles -->
  <path d="M420 145 L422 140 L424 145 L422 150 Z" fill="#F97316" opacity="0.5"/>
  <path d="M490 150 L492 146 L494 150 L492 154 Z" fill="#D4A574" opacity="0.6"/>
  <circle cx="430" cy="180" r="1.5" fill="#D4A574" opacity="0.5"/>
  <circle cx="480" cy="185" r="1.5" fill="#D4A574" opacity="0.5"/>
  <path d="M505 170 L507 166 L509 170 L507 174 Z" fill="#F97316" opacity="0.4"/>

  <!-- Specs below ring -->
  <line x1="380" y1="270" x2="530" y2="270" stroke="#E5E7EB" stroke-width="1"/>
  <text x="380" y="288" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Material: Gold</text>
  <text x="380" y="300" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Size: 7</text>
  <text x="470" y="288" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Qty: 1</text>
  <text x="470" y="300" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Engraved</text>

  <!-- Price tag -->
  <rect x="400" y="308" width="110" height="24" rx="12" fill="#FFFBEB" stroke="#D4A574" stroke-width="1.5"/>
  <text x="425" y="325" font-family="Arial, sans-serif" font-size="12" fill="#D4A574" font-weight="bold">Rs 1,500</text>

  <!-- Connecting arrow -->
  <path d="M300 200 C320 190 340 190 360 200" stroke="#D4A574" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <polygon points="358,194 366,200 358,206" fill="#D4A574"/>

  <!-- Decorative -->
  <circle cx="340" cy="60" r="20" fill="#D4A574" opacity="0.06"/>
  <circle cx="500" cy="370" r="25" fill="#F97316" opacity="0.06"/>
  <circle cx="50" cy="20" r="15" fill="#D4A574" opacity="0.08"/>
</svg>