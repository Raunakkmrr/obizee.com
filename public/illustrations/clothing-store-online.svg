<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Clothing Rack - Left Side -->
  <!-- Rack frame -->
  <rect x="40" y="60" width="200" height="8" rx="4" fill="#1F2937"/>
  <rect x="60" y="60" width="8" height="220" rx="4" fill="#1F2937"/>
  <rect x="232" y="60" width="8" height="220" rx="4" fill="#1F2937"/>
  <!-- Rack feet -->
  <rect x="40" y="270" width="48" height="8" rx="4" fill="#9CA3AF"/>
  <rect x="212" y="270" width="48" height="8" rx="4" fill="#9CA3AF"/>

  <!-- Hanger 1 - Red Saree -->
  <line x1="100" y1="60" x2="100" y2="80" stroke="#9CA3AF" stroke-width="2"/>
  <path d="M80 80 L100 72 L120 80" stroke="#9CA3AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="82" y="80" width="36" height="130" rx="4" fill="#EF4444" opacity="0.85"/>
  <rect x="86" y="80" width="28" height="130" rx="3" fill="#DC2626" opacity="0.5"/>
  <!-- Saree drape detail -->
  <path d="M82 140 Q90 135 100 140 Q110 145 118 140" stroke="#FCA5A5" stroke-width="1.5" fill="none"/>
  <path d="M82 160 Q90 155 100 160 Q110 165 118 160" stroke="#FCA5A5" stroke-width="1.5" fill="none"/>

  <!-- Hanger 2 - Blue Kurti -->
  <line x1="150" y1="60" x2="150" y2="85" stroke="#9CA3AF" stroke-width="2"/>
  <path d="M130 85 L150 77 L170 85" stroke="#9CA3AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M132 85 L132 200 Q132 208 140 208 L160 208 Q168 208 168 200 L168 85 Z" fill="#3B82F6" opacity="0.85"/>
  <!-- Kurti sleeves -->
  <path d="M132 85 L118 115 L126 118 L136 95" fill="#2563EB" opacity="0.7"/>
  <path d="M168 85 L182 115 L174 118 L164 95" fill="#2563EB" opacity="0.7"/>
  <!-- Kurti neckline -->
  <path d="M142 85 Q150 95 158 85" stroke="#1D4ED8" stroke-width="1.5" fill="none"/>

  <!-- Hanger 3 - Green Dress -->
  <line x1="200" y1="60" x2="200" y2="75" stroke="#9CA3AF" stroke-width="2"/>
  <path d="M180 75 L200 67 L220 75" stroke="#9CA3AF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M184 75 L180 220 Q180 226 186 226 L214 226 Q220 226 220 220 L216 75 Z" fill="#16A34A" opacity="0.8"/>
  <!-- Dress belt -->
  <rect x="180" y="140" width="40" height="6" rx="3" fill="#15803D"/>
  <!-- Dress pattern -->
  <circle cx="195" cy="110" r="2" fill="#BBF7D0" opacity="0.6"/>
  <circle cx="205" cy="120" r="2" fill="#BBF7D0" opacity="0.6"/>
  <circle cx="192" cy="165" r="2" fill="#BBF7D0" opacity="0.6"/>
  <circle cx="208" cy="180" r="2" fill="#BBF7D0" opacity="0.6"/>

  <!-- Connecting Arrow - Dotted curved line -->
  <path d="M260 170 C300 130 320 130 350 170" stroke="#F97316" stroke-width="2.5" stroke-dasharray="8 5" fill="none"/>
  <polygon points="348,162 356,172 346,176" fill="#F97316"/>
  <!-- Small sparkles on arrow -->
  <circle cx="290" cy="145" r="3" fill="#F97316" opacity="0.4"/>
  <circle cx="320" cy="140" r="2" fill="#F97316" opacity="0.6"/>

  <!-- Smartphone - Right Side -->
  <rect x="360" y="50" width="190" height="310" rx="20" fill="#1F2937"/>
  <rect x="368" y="70" width="174" height="274" rx="12" fill="#FFFFFF"/>
  <!-- Phone notch -->
  <rect x="425" y="54" width="60" height="8" rx="4" fill="#374151"/>

  <!-- Phone Header - oBizee branding -->
  <rect x="368" y="70" width="174" height="44" rx="12" fill="#F97316"/>
  <rect x="368" y="90" width="174" height="24" fill="#F97316"/>
  <!-- Shopping bag icon -->
  <rect x="382" y="80" width="18" height="16" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <path d="M387 80 L387 76 Q391 70 395 76 L395 80" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <text x="404" y="93" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">oBizee Store</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <rect x="378" y="122" width="74" height="80" rx="8" fill="#FEE2E2"/>
  <rect x="385" y="128" width="60" height="48" rx="4" fill="#EF4444" opacity="0.3"/>
  <rect x="395" y="135" width="40" height="35" rx="2" fill="#EF4444" opacity="0.6"/>
  <text x="385" y="192" font-family="Arial, sans-serif" font-size="8" fill="#1F2937">Red Saree</text>
  <text x="425" y="192" font-family="Arial, sans-serif" font-size="7" fill="#9CA3AF">Rs 1,200</text>

  <!-- Product 2 -->
  <rect x="458" y="122" width="74" height="80" rx="8" fill="#DBEAFE"/>
  <rect x="465" y="128" width="60" height="48" rx="4" fill="#3B82F6" opacity="0.3"/>
  <rect x="475" y="135" width="40" height="35" rx="2" fill="#3B82F6" opacity="0.6"/>
  <text x="465" y="192" font-family="Arial, sans-serif" font-size="8" fill="#1F2937">Blue Kurti</text>
  <text x="505" y="192" font-family="Arial, sans-serif" font-size="7" fill="#9CA3AF">Rs 800</text>

  <!-- Product 3 -->
  <rect x="378" y="210" width="74" height="80" rx="8" fill="#DCFCE7"/>
  <rect x="385" y="216" width="60" height="48" rx="4" fill="#16A34A" opacity="0.3"/>
  <rect x="395" y="223" width="40" height="35" rx="2" fill="#16A34A" opacity="0.6"/>
  <text x="385" y="280" font-family="Arial, sans-serif" font-size="8" fill="#1F2937">Green Dress</text>
  <text x="425" y="280" font-family="Arial, sans-serif" font-size="7" fill="#9CA3AF">Rs 950</text>

  <!-- Product 4 -->
  <rect x="458" y="210" width="74" height="80" rx="8" fill="#FEF3C7"/>
  <rect x="465" y="216" width="60" height="48" rx="4" fill="#F59E0B" opacity="0.3"/>
  <rect x="475" y="223" width="40" height="35" rx="2" fill="#F59E0B" opacity="0.6"/>
  <text x="465" y="280" font-family="Arial, sans-serif" font-size="8" fill="#1F2937">Gold Kurti</text>
  <text x="505" y="280" font-family="Arial, sans-serif" font-size="7" fill="#9CA3AF">Rs 1,500</text>

  <!-- Shop Now Button -->
  <rect x="398" y="300" width="114" height="32" rx="16" fill="#F97316"/>
  <text x="425" y="321" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Shop Now</text>

  <!-- Decorative elements -->
  <circle cx="50" cy="320" r="20" fill="#F97316" opacity="0.08"/>
  <circle cx="310" cy="50" r="15" fill="#F97316" opacity="0.1"/>
  <circle cx="280" cy="330" r="25" fill="#F97316" opacity="0.06"/>

  <!-- Label -->
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Physical Store</text>
  <text x="410" y="370" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF">Online Store</text>
</svg>