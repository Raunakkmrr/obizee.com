<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF7ED" rx="0"/>

  <!-- Left: Kitchen items -->
  <!-- Cake stand -->
  <rect x="60" y="230" width="80" height="6" rx="3" fill="#9CA3AF" opacity="0.5"/>
  <rect x="90" y="236" width="20" height="20" rx="2" fill="#9CA3AF" opacity="0.4"/>
  <rect x="80" y="256" width="40" height="4" rx="2" fill="#9CA3AF" opacity="0.5"/>
  <!-- Cake on stand -->
  <rect x="70" y="190" width="60" height="40" rx="8" fill="#F97316" opacity="0.7"/>
  <rect x="70" y="190" width="60" height="12" rx="6" fill="#FBBF24" opacity="0.5"/>
  <!-- Cake layers -->
  <line x1="70" y1="210" x2="130" y2="210" stroke="#EA580C" stroke-width="1" opacity="0.4"/>
  <!-- Cherry on top -->
  <circle cx="100" cy="187" r="5" fill="#EF4444"/>
  <line x1="100" y1="182" x2="100" y2="178" stroke="#16A34A" stroke-width="1.5"/>

  <!-- Tiffin box stack -->
  <rect x="155" y="180" width="50" height="18" rx="6" fill="#EF4444" opacity="0.6"/>
  <rect x="155" y="202" width="50" height="18" rx="6" fill="#3B82F6" opacity="0.6"/>
  <rect x="155" y="224" width="50" height="18" rx="6" fill="#16A34A" opacity="0.6"/>
  <!-- Tiffin handle -->
  <path d="M175 180 L175 170 Q180 164 185 170 L185 180" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <!-- Tiffin clasps -->
  <rect x="148" y="198" width="8" height="6" rx="2" fill="#9CA3AF" opacity="0.5"/>
  <rect x="148" y="220" width="8" height="6" rx="2" fill="#9CA3AF" opacity="0.5"/>

  <!-- Cookies/Snacks -->
  <circle cx="80" cy="300" r="10" fill="#FBBF24" opacity="0.7"/>
  <circle cx="80" cy="300" r="6" fill="#D4A574" opacity="0.3"/>
  <circle cx="105" cy="305" r="8" fill="#FBBF24" opacity="0.6"/>
  <circle cx="105" cy="305" r="4" fill="#D4A574" opacity="0.3"/>
  <circle cx="60" cy="310" r="9" fill="#FBBF24" opacity="0.5"/>
  <circle cx="130" cy="300" r="7" fill="#F97316" opacity="0.4"/>
  <!-- Chip details on cookies -->
  <circle cx="77" cy="297" r="1.5" fill="#92400E" opacity="0.5"/>
  <circle cx="83" cy="303" r="1.5" fill="#92400E" opacity="0.5"/>
  <circle cx="78" cy="305" r="1" fill="#92400E" opacity="0.5"/>

  <!-- Steam/Aroma lines from food -->
  <path d="M100 180 Q95 170 100 160 Q105 150 100 140" stroke="#9CA3AF" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round"/>
  <path d="M115 175 Q110 165 115 155 Q120 145 115 135" stroke="#9CA3AF" stroke-width="1.5" opacity="0.25" fill="none" stroke-linecap="round"/>
  <path d="M85 178 Q80 168 85 158 Q90 148 85 138" stroke="#9CA3AF" stroke-width="1.5" opacity="0.2" fill="none" stroke-linecap="round"/>

  <!-- Transition: Steam to wifi/digital waves -->
  <path d="M180 140 Q220 100 280 120" stroke="#F97316" stroke-width="1.5" opacity="0.3" fill="none" stroke-dasharray="4 3"/>
  <path d="M200 130 Q240 90 290 110" stroke="#F97316" stroke-width="1.5" opacity="0.25" fill="none" stroke-dasharray="4 3"/>
  <path d="M220 125 Q255 85 300 105" stroke="#F97316" stroke-width="1.5" opacity="0.2" fill="none" stroke-dasharray="4 3"/>

  <!-- WiFi signal icon in transition zone -->
  <path d="M260 100 Q270 90 280 100" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M254 108 Q270 92 286 108" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M248 116 Q270 95 292 116" stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.2"/>

