  <rect x="358" y="68" width="184" height="38" rx="14" fill="#F97316"/>
  <rect x="358" y="84" width="184" height="22" fill="#F97316"/>
  <text x="400" y="92" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Home Kitchen</text>
  <!-- Search icon -->
  <circle cx="528" cy="88" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  <line x1="533" y1="93" x2="537" y2="97" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>

  <!-- Category tabs -->
  <rect x="365" y="112" width="50" height="22" rx="11" fill="#F97316"/>
  <text x="376" y="127" font-family="Arial, sans-serif" font-size="8" fill="#FFFFFF" font-weight="600">Cakes</text>
  <rect x="420" y="112" width="50" height="22" rx="11" fill="#FFF7ED" stroke="#F97316" stroke-width="1"/>
  <text x="432" y="127" font-family="Arial, sans-serif" font-size="8" fill="#F97316">Tiffin</text>
  <rect x="475" y="112" width="55" height="22" rx="11" fill="#FFF7ED" stroke="#F97316" stroke-width="1"/>
  <text x="486" y="127" font-family="Arial, sans-serif" font-size="8" fill="#F97316">Snacks</text>

  <!-- Menu items -->
  <!-- Item 1 -->
  <rect x="368" y="142" width="164" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="375" y="148" width="40" height="40" rx="8" fill="#FEF3C7"/>
  <!-- Cake icon -->
  <rect x="382" y="160" width="26" height="18" rx="4" fill="#F97316" opacity="0.6"/>
  <rect x="382" y="160" width="26" height="6" rx="3" fill="#FBBF24" opacity="0.5"/>
  <circle cx="395" cy="157" r="3" fill="#EF4444" opacity="0.7"/>
  <text x="422" y="162" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Chocolate Cake</text>
  <text x="422" y="175" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">1 kg - Eggless</text>
  <text x="422" y="188" font-family="Arial, sans-serif" font-size="10" fill="#F97316" font-weight="bold">Rs 800</text>

  <!-- Item 2 -->
  <rect x="368" y="206" width="164" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="375" y="212" width="40" height="40" rx="8" fill="#DCFCE7"/>
  <!-- Tiffin icon -->
  <rect x="384" y="222" width="22" height="8" rx="3" fill="#16A34A" opacity="0.5"/>
  <rect x="384" y="232" width="22" height="8" rx="3" fill="#16A34A" opacity="0.4"/>
  <text x="422" y="226" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Daily Tiffin</text>
  <text x="422" y="239" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">Veg - 2 Roti + Sabzi</text>
  <text x="422" y="252" font-family="Arial, sans-serif" font-size="10" fill="#F97316" font-weight="bold">Rs 120</text>

  <!-- Item 3 -->
  <rect x="368" y="270" width="164" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="375" y="276" width="40" height="40" rx="8" fill="#FEF3C7"/>
  <!-- Cookie icon -->
  <circle cx="395" cy="296" r="12" fill="#FBBF24" opacity="0.6"/>
  <circle cx="391" cy="293" r="1.5" fill="#92400E" opacity="0.5"/>
  <circle cx="398" cy="298" r="1.5" fill="#92400E" opacity="0.5"/>
  <text x="422" y="290" font-family="Arial, sans-serif" font-size="9" fill="#1F2937" font-weight="600">Cookies Box</text>
  <text x="422" y="303" font-family="Arial, sans-serif" font-size="8" fill="#9CA3AF">12 pcs - Assorted</text>
  <text x="422" y="316" font-family="Arial, sans-serif" font-size="10" fill="#F97316" font-weight="bold">Rs 350</text>

  <!-- Bottom nav dots -->
  <rect x="398" y="340" width="104" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="398" y="340" width="35" height="8" rx="4" fill="#F97316" opacity="0.6"/>

  <!-- Labels -->
  <text x="58" y="348" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Your Kitchen</text>
  <text x="400" y="388" font-family="Arial, sans-serif" font-size="10" fill="#9CA3AF">Your Online Menu</text>

  <!-- Decorative -->
  <circle cx="300" cy="370" r="20" fill="#F97316" opacity="0.06"/>
  <circle cx="40" cy="120" r="18" fill="#F97316" opacity="0.08"/>
</svg>