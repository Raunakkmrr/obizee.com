  <rect x="350" y="50" width="200" height="320" rx="22" fill="#1F2937"/>
  <rect x="358" y="68" width="184" height="286" rx="14" fill="#FFFFFF"/>
  <!-- Notch -->
  <rect x="415" y="54" width="60" height="8" rx="4" fill="#374151"/>

