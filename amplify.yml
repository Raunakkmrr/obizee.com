version: 1
frontend:
  phases:
    preBuild:
      commands:
        - find public -name '._*' -delete 2>/dev/null || true
        - find public -name '.DS_Store' -delete 2>/dev/null || true
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
