version: 1
frontend:
  phases:
    preBuild:
      commands:
        - find public -name '._*' -delete 2>/dev/null || true
        - find public -name '.DS_Store' -delete 2>/dev/null || true
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        - npm run test:content-release
        - npm run test:visibility
        - npm run test:buyer-fit
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.png'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.jpg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.jpeg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.webp'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.svg'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.woff2'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600, s-maxage=86400'
  # Sitemaps. Without this they fall to Amplify's default
  # 'max-age=0, s-maxage=31536000' -- a one-year CloudFront cache that is only
  # ever cleared by the deploy-time invalidation. If one invalidation is missed,
  # Google re-reads a stale sitemap for a year and never sees a new lastmod.
  # A one-day edge cache bounds that failure to a day.
  - pattern: '**/*.xml'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600, s-maxage=86400'
  # The iOS app-association file. Its path must be exactly
  # /.well-known/apple-app-site-association, so it has no extension and would
  # otherwise be served as application/octet-stream -- Apple requires
  # application/json and its CDN validates the file before any device asks, so
  # a wrong type means universal links never work and nothing reports why.
  - pattern: '/.well-known/apple-app-site-association'
    headers:
      - key: 'Content-Type'
        value: 'application/json'
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
